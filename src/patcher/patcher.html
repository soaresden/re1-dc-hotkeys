<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RE1 Hotkeys Patcher</title>
<style>
  :root {
    --bg: #f4f1ec; --card: #ffffff; --ink: #1d1b19; --muted: #6b655e; --line: #ddd6cc;
    --accent: #8f1d14; --accent-ink: #ffffff; --ok: #2f7d32; --bad: #b3261e; --chip: #efe9e1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141211; --card: #1e1b19; --ink: #ece7e1; --muted: #a39b92; --line: #35302c;
      --accent: #c8392b; --accent-ink: #ffffff; --ok: #6cc070; --bad: #ff8a80; --chip: #2a2623;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141211; --card: #1e1b19; --ink: #ece7e1; --muted: #a39b92; --line: #35302c;
    --accent: #c8392b; --accent-ink: #ffffff; --ok: #6cc070; --bad: #ff8a80; --chip: #2a2623;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: .2px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .lang button { border: 0; border-radius: 0; padding: 6px 10px; background: var(--card); }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
            padding: 18px 18px 16px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .step { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center;
          border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 12px;
          margin-right: 8px; vertical-align: 1px; }
  input[type=file] { width: 100%; padding: 10px; border: 1px dashed var(--line); border-radius: 8px;
                     background: var(--chip); color: var(--ink); }
  .status { margin-top: 10px; font-size: 14px; min-height: 21px; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  .versions { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  label.feat { display: flex; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--line); cursor: pointer; }
  label.feat:first-of-type { border-top: 0; }
  label.feat input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .feat b { display: block; }
  .feat span { color: var(--muted); font-size: 14px; }
  kbd { background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px;
        font: 12px/18px ui-monospace, Consolas, monospace; }
  .buttons { display: flex; flex-wrap: wrap; gap: 10px; }
  button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--chip); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .45; cursor: default; }
  .note { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>RE1 Hotkeys Patcher</h1>
      <p class="sub">Resident Evil – Director's Cut · <span data-t="version"></span> <span id="ver"></span></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="fr">FR</button>
    </div>
  </header>

  <section>
    <h2><span class="step">1</span><span data-t="s1"></span></h2>
    <input type="file" id="file" accept=".bin">
    <div class="status" id="status"></div>
    <p class="versions" id="versions"></p>
  </section>

  <section>
    <h2><span class="step">2</span><span data-t="s2"></span></h2>
    <div id="features"></div>
  </section>

  <section>
    <h2><span class="step">3</span><span data-t="s3"></span></h2>
    <div class="buttons">
      <button class="primary" id="dlBin" disabled data-t="dlBin"></button>
      <button id="dlPpf" disabled data-t="dlPpf"></button>
    </div>
    <p class="note" data-t="note"></p>
  </section>

  <footer><span data-t="footer"></span> · <a href="https://github.com/soaresden/re1-dc-hotkeys">GitHub</a></footer>
</main>

<script>
/*CORE*/
</script>
<script>
/*DATA*/
</script>
<script>
(function () {
  'use strict';
  const P = window.RE1Patch, D = P.DATA;
  const T = {
    en: {
      version: 'version', s1: 'Game image', s2: 'Options', s3: 'Patch',
      pick: 'Pick the original Redump <b>.bin</b> of the game (data track). Nothing is uploaded: everything happens in your browser.',
      supported: 'Supported: ',
      badSize: n => 'Unknown image size (' + n + ' bytes): it must be the original Redump .bin of a supported version.',
      reading: 'Reading…',
      ok: v => '✔ ' + v + ': original executable recognised.',
      already: 'This image is already patched: pick the original one.',
      badExe: c => 'Executable not recognised (CRC ' + c + '): it must be the original Redump image.',
      dlBin: 'Download the patched .bin (+ .cue)', dlPpf: 'Download a .ppf',
      note: 'The <b>.ppf</b> is for DuckStation (“Apply Image Patches”): put it next to the original image with the same file name. It also works with a <b>.chd</b> of the same game.<br>Only have a .chd? Extract the .bin first: <kbd>chdman extractcd -i game.chd -o game.cue -ob game.bin</kbd>',
      footer: 'The patch only changes the game executable, not the textures.',
      feats: [
        ['Move items with <kbd>Square</kbd>', 'In the inventory: Square picks an item up, Square on another one swaps them. The equipped weapon follows its item.'],
        ['Quick slots <kbd>L2</kbd> + d-pad', 'The first 4 slots (arrows ↑ ↓ ← →): weapon = equip, healing item = use. While L2 is held, the d-pad no longer moves the character.'],
        ['Quick-slot overlay', 'Hold L2 to see the 4 slots at the bottom of the screen (icons, quantities, equipped weapon).'],
        ['Health, top left', 'Health in digits, in the colour of the condition (green, yellow, orange, red).'],
        ['Equipped weapon and ammo', 'Under the health: weapon icon and remaining ammo (red when empty).'],
        ['Quick turn <kbd>Square</kbd> + <kbd>Down</kbd>', 'Like in RE3: a fast 180° turn.'],
        ['In-game options menu', 'Hold <kbd>Select</kbd> about 3 seconds in game: the game pauses and a menu switches the options above on or off.'],
      ],
    },
    fr: {
      version: 'version', s1: 'Image du jeu', s2: 'Options', s3: 'Patcher',
      pick: 'Choisis le <b>.bin</b> Redump d\'origine du jeu (piste de données). Rien n\'est envoyé : tout se passe dans ton navigateur.',
      supported: 'Versions prises en charge : ',
      badSize: n => 'Taille d\'image inconnue (' + n + ' octets) : il faut le .bin Redump d\'origine d\'une version prise en charge.',
      reading: 'Lecture…',
      ok: v => '✔ ' + v + ' : exécutable d\'origine reconnu.',
      already: 'Cette image est déjà patchée : choisis l\'image d\'origine.',
      badExe: c => 'Exécutable non reconnu (CRC ' + c + ') : il faut l\'image Redump d\'origine.',
      dlBin: 'Télécharger le .bin patché (+ .cue)', dlPpf: 'Télécharger un .ppf',
      note: 'Le <b>.ppf</b> sert à DuckStation (« Apply Image Patches ») : place-le à côté de l\'image d\'origine avec le même nom de fichier. Ça marche aussi avec un <b>.chd</b> du même jeu.<br>Seulement un .chd ? Extrais d\'abord le .bin : <kbd>chdman extractcd -i jeu.chd -o jeu.cue -ob jeu.bin</kbd>',
      footer: 'Le patch ne modifie que l\'exécutable du jeu, pas les textures.',
      feats: [
        ['Déplacer les objets avec <kbd>Carré</kbd>', 'Dans l\'inventaire : Carré prend un objet, Carré sur un autre les échange. L\'arme équipée suit son objet.'],
        ['Cases rapides <kbd>L2</kbd> + croix', 'Les 4 premières cases (flèches ↑ ↓ ← →) : arme = équiper, soin = utiliser. Pendant L2, la croix ne fait plus marcher.'],
        ['Overlay des cases rapides', 'En maintenant L2, les 4 cases s\'affichent en bas de l\'écran (icônes, quantités, arme équipée).'],
        ['Vie en haut à gauche', 'La santé en chiffres, couleur de l\'état (vert, jaune, orange, rouge).'],
        ['Arme équipée et munitions', 'Sous la vie : icône de l\'arme et munitions restantes (rouge à zéro).'],
        ['Demi-tour <kbd>Carré</kbd> + <kbd>Bas</kbd>', 'Comme dans RE3 : un demi-tour rapide.'],
        ['Menu d\'options en jeu','Maintiens <kbd>Select</kbd> environ 3 secondes en jeu : le jeu se met en pause et un menu active ou désactive les options ci-dessus.'],
      ],
    },
  };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let lang = store.get('re1hk.lang') || ((navigator.language || '').toLowerCase().startsWith('fr') ? 'fr' : 'en');
  let lastStatus = ['pick'];

  document.getElementById('ver').textContent = D.version;
  const box = document.getElementById('features');
  const nFeat = T.en.feats.length;
  const checks = [];
  for (let i = 0; i < nFeat; i++) {
    const l = document.createElement('label');
    l.className = 'feat';
    l.innerHTML = '<input type="checkbox" checked><div><b></b><span></span></div>';
    box.appendChild(l);
    checks.push(l.querySelector('input'));
  }
  try { const saved = JSON.parse(store.get('re1hk.features') || 'null');
        if (Array.isArray(saved)) saved.forEach((v, i) => { if (checks[i]) checks[i].checked = !!v; }); } catch (e) {}
  checks.forEach(c => c.addEventListener('change', () => store.set('re1hk.features', JSON.stringify(checks.map(c => c.checked ? 1 : 0)))));

  const status = document.getElementById('status');
  const dlBin = document.getElementById('dlBin'), dlPpf = document.getElementById('dlPpf');
  function say(key, cls, arg) {
    lastStatus = [key, cls, arg];
    const t = T[lang][key];
    status.innerHTML = typeof t === 'function' ? t(arg) : t;
    status.className = 'status ' + (cls || '');
  }
  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(e => { e.innerHTML = T[lang][e.dataset.t]; });
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    box.querySelectorAll('label.feat').forEach((l, i) => {
      l.querySelector('b').innerHTML = T[lang].feats[i][0];
      l.querySelector('span').innerHTML = T[lang].feats[i][1];
    });
    document.getElementById('versions').textContent = T[lang].supported +
      Object.values(D.versions).map(v => v.name.replace('Resident Evil - ', '') + ' (' + v.serial + ')').join(' · ');
    say(...lastStatus);
  }
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang; store.set('re1hk.lang', lang); render();
  }));

  let file = null, vid = null, sectors = null, exe = null;
  const SECTOR = P.SECTOR;
  const range = () => { const V = D.versions[vid]; return [V.exeLba * SECTOR, V.exeSectors * SECTOR]; };

  document.getElementById('file').addEventListener('change', async ev => {
    file = ev.target.files[0]; vid = sectors = exe = null;
    dlBin.disabled = dlPpf.disabled = true;
    if (!file) return;
    vid = P.versionForSize(file.size);
    if (!vid) { say('badSize', 'bad', file.size.toLocaleString(lang)); return; }
    say('reading');
    const [start, len] = range();
    sectors = new Uint8Array(await file.slice(start, start + len).arrayBuffer());
    exe = P.readExe(sectors);
    const crc = P.crc32(exe), V = D.versions[vid];
    if (crc === V.exeCrc) { say('ok', 'ok', V.name.replace('Resident Evil - ', '') + ' (' + V.serial + ')'); dlBin.disabled = dlPpf.disabled = false; }
    else if (crc === V.patchedCrc) say('already', 'bad');
    else say('badExe', 'bad', crc.toString(16));
  });

  function build() {
    const cfg = checks.map(c => c.checked ? 1 : 0);
    return P.encodeSectors(sectors, P.patchExe(vid, exe, cfg));
  }
  const stem = () => file.name.replace(/\.bin$/i, '');
  /* .cue of the patched image: one file, or (Redump track 1 alone) the
     patched track 1 + the original track 2 file, unchanged */
  function cue(name) {
    const V = D.versions[vid];
    let text = 'FILE "' + name + '" BINARY\n';
    if (file.size === V.track1Size) {
      text += '  TRACK 01 MODE2/2352\n    INDEX 01 00:00:00\n' +
              'FILE "' + file.name.replace(/Track 0?1\)/i, m => m.replace('1', '2')) + '" BINARY\n' +
              '  TRACK 02 AUDIO\n    INDEX 00 00:00:00\n    INDEX 01 00:02:00\n';
    } else text += V.cueTracks;
    return text.replace(/\n/g, '\r\n');
  }
  function save(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
  dlBin.addEventListener('click', () => {
    const [start, len] = range(), name = stem() + ' [Hotkeys].bin';
    /* the unchanged parts are slices of the file: nothing is loaded in memory */
    save(new Blob([file.slice(0, start), build(), file.slice(start + len)], { type: 'application/octet-stream' }), name);
    save(new Blob([cue(name)], { type: 'text/plain' }), stem() + ' [Hotkeys].cue');
  });
  dlPpf.addEventListener('click', () => {
    const [start] = range();
    save(new Blob([P.makePPF(sectors, build(), start, D.ppfDesc)], { type: 'application/octet-stream' }), stem() + '.ppf');
  });
  render();
})();
</script>
</body>
</html>
